services:
  garmin-sync:
    image: ghcr.io/frankzotynia10/garmin-sync:latest
    container_name: garmin-sync
    restart: unless-stopped
    env_file:
      - /mnt/user/appdata/fitness-sync/garmin/.env
    volumes:
      - /mnt/user/appdata/fitness-sync/garmin/tokens:/root/.garminconnect
    command: tail -f /dev/null

  strava-sync:
    image: ghcr.io/frankzotynia10/strava-sync:latest
    container_name: strava-sync
    restart: unless-stopped
    env_file:
      - /mnt/user/appdata/fitness-sync/strava/.env
    volumes:
      - /mnt/user/appdata/fitness-sync/strava/tokens:/data
    command: tail -f /dev/null

  hevy-sync:
    image: ghcr.io/frankzotynia10/hevy-sync:latest
    container_name: hevy-sync
    restart: unless-stopped
    env_file:
      - /mnt/user/appdata/fitness-sync/hevy/.env
    command: tail -f /dev/null

  hevy2garmin:
    image: ghcr.io/frankzotynia10/hevy2garmin:latest
    container_name: hevy2garmin
    restart: unless-stopped
    env_file:
      - /mnt/user/appdata/hevy2garmin/.env
    volumes:
      - /mnt/user/appdata/fitness-sync/garmin/tokens:/root/.garminconnect
      - /mnt/user/appdata/hevy2garmin:/root/.hevy2garmin
    command: tail -f /dev/null
