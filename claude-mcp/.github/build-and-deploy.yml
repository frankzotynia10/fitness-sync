name: Build, Push & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push garmin-sync
        uses: docker/build-push-action@v5
        with:
          context: ./garmin
          file: ./garmin/dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/garmin-sync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push hevy-sync
        uses: docker/build-push-action@v5
        with:
          context: ./hevy
          file: ./hevy/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hevy-sync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push strava-sync
        uses: docker/build-push-action@v5
        with:
          context: ./strava
          file: ./strava/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/strava-sync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push claude-mcp
        uses: docker/build-push-action@v5
        with:
          context: ./claude-mcp
          file: ./claude-mcp/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/claude-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-n8n:
    name: Trigger n8n Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Fire webhook to n8n
        run: |
          curl -X POST https://n8n.mayfairlabs.cloud/webhook/fitness-deploy \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: ${{ secrets.N8N_DEPLOY_SECRET }}" \
            -d '{
              "repo": "${{ github.repository }}",
              "commit": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "triggered_by": "${{ github.actor }}"
            }'