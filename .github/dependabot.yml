version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/garmin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "garmin-sync"

  - package-ecosystem: "pip"
    directory: "/hevy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "hevy-sync"

  - package-ecosystem: "pip"
    directory: "/strava"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "strava-sync"

  - package-ecosystem: "pip"
    directory: "/claude-mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "claude-mcp"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
